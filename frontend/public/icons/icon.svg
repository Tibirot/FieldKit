<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="FieldKit">
  <!--
    FieldKit app icon — source of truth for icon-192.png, icon-512.png and apple-touch-icon.png.
    Regenerate the PNGs with `node scripts/generate-icons.mjs`.

