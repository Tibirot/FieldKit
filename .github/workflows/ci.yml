name: CI

# Runs on every PR — whatever it targets — and on pushes to main.
# This is the enforcement half of docs/engineering/pull-requests.md — the gates are only real
# once these checks are marked "required" in branch protection (see the note at the bottom).
#
# It is written to be GREEN on today's scaffold (no test projects yet) and to light up
# automatically as Phase 0 lands the test projects — no workflow changes needed.

on:
  # Deliberately unfiltered. `branches: [main]` here would mean a PR whose base is another PR's
  # branch never runs — and stacking is exactly what pull-requests.md asks for when work exceeds
  # the ~400-line budget, so the checks would go quiet on precisely the largest changes. Two such
  # PRs merged unchecked before this was fixed.
  pull_request:
  push:
    branches: [main]

# Newer runs on the same ref cancel older, still-running ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  # Pinned to the major the lockfile is generated with. npm's optional-dependency and dedupe
  # resolution differs between npm majors, so a mismatch here silently rewrites package-lock.json
  # and breaks `npm ci`. Bump this and regenerate the lockfile together, never separately.
  # (Node 20 reached end-of-life in April 2026.)
  NODE_VERSION: "24"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

  # Ryuk is Testcontainers' reaper: a sidecar that removes leftover containers when a test run dies
  # without cleaning up. That is worth having locally, where the machine persists. On a CI runner it
  # is not — the whole VM is destroyed after the job, so there is nothing left to reap.
  #
  # Disabling it removes a Docker Hub pull, and Hub is the registry that failed on 2026-08-07. It is
  # also the one image whose tag lives inside the Testcontainers package rather than in this repo,
  # so it is the one the pre-pull step below cannot pin without guessing.
  #
  # CI only. Nothing here changes how the suite runs locally.
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Backend: build + unit + architecture + tenant-isolation + integration (Testcontainers)
  # ubuntu-latest ships Docker, which Testcontainers needs for real-Postgres integration tests.
  # ─────────────────────────────────────────────────────────────
  dotnet:
    name: dotnet (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore FieldKit.slnx

      - name: Build (Release)
        run: dotnet build FieldKit.slnx -c Release --no-restore

      # Pulled here rather than lazily by Testcontainers, because a registry hiccup mid-suite is
      # indistinguishable from a broken build: every container-backed test fails in ~1ms with a
      # Docker API error, and the run reads as "30 tests broken" rather than "the registry timed
      # out". Doing it up front turns that into one step that says which image and why.
      #
      # Retried because the failure it exists for is transient — a Docker Hub timeout took out a
      # whole run on 2026-08-07 and passed on a plain re-run minutes later. Three attempts with
      # backoff; if all three fail, Hub is genuinely unreachable and stopping is the right answer.
      - name: Pre-pull test container images
        run: |
          set -euo pipefail
          for image in postgres:16-alpine quay.io/keycloak/keycloak:26.6; do
            for attempt in 1 2 3; do
              if docker pull --quiet "$image"; then
                echo "pulled $image"
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error title=Image pull failed::$image could not be pulled after 3 attempts."
                exit 1
              fi
              echo "::warning title=Retrying pull::$image attempt $attempt failed; retrying."
              sleep $(( attempt * 10 ))
            done
          done

      # Runs every test project it finds. Once Phase 0 adds them, this covers unit,
      # NetArchTest architecture tests, tenant-isolation, and Testcontainers integration.
      # Skips cleanly (green) while the repo is still a scaffold with no tests.
      - name: Test (unit · architecture · tenant-isolation · integration)
        run: |
          set -euo pipefail
          projects=$(find . -name '*[Tt]est*.csproj' -not -path '*/bin/*' -not -path '*/obj/*' || true)
          if [ -z "$projects" ]; then
            echo "::notice title=No tests yet::No test projects found (scaffold). Add them in Phase 0 — see docs/architecture/17-testing-strategy.md"
            exit 0
          fi
          dotnet test FieldKit.slnx -c Release --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results
          path: "**/TestResults/**"
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Frontend: lint + build + unit tests
  # Uses npm (package-lock.json). `--if-present` makes a step a no-op until the script exists.
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        # `npm ci` — strict: it installs exactly the lockfile and fails if package.json and the
        # lockfile disagree. This is the gate. It previously ran as `npm install`, which silently
        # *rewrote* the lockfile to whatever the runner resolved, so a broken lockfile could never
        # fail the build — the check existed but proved nothing.
        #
        # If this step fails with "Missing: <pkg> from lock file", the lockfile was regenerated on a
        # different OS or npm major. Don't relax this step — regenerate the lockfile the way
        # docs/engineering/frontend-toolchain.md describes and commit that.
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck & build
        run: npm run build --if-present

      - name: Unit tests (Vitest)
        run: npm test --if-present

      # Playwright e2e lands in Phase 4 (docs/architecture/17-testing-strategy.md §6).
      # When it does, add: `npx playwright install --with-deps` then `npm run e2e --if-present`.

# ─────────────────────────────────────────────────────────────
# Making the gates real (do this in the GitHub UI once tests exist):
#   Settings → Branches → Branch protection for `main`:
#     • Require a pull request before merging (block direct pushes to main)
#     • Require status checks to pass:  dotnet (build + test)  ·  frontend (lint + build)
#     • Require branches to be up to date before merging
#   Do NOT add a paths-ignore filter to required checks — a skipped required check
#   shows as pending and blocks merge forever.
# When architecture + tenant-isolation tests exist and you want them as *separate* required
# checks, split them into their own jobs here (e.g. `dotnet test --filter Category=Architecture`).
# ─────────────────────────────────────────────────────────────
