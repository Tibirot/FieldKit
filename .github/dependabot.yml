# Dependabot version updates — routine "a newer version exists" bumps.
#
# Distinct from Dependabot *security* updates (CVE-driven), which are a repository toggle and need
# no config. Both are wanted: security updates are the safety net, this is the hygiene.
#
# Grouping is the point. Ungrouped, each outdated dependency opens its own PR (this repo carries
# ~22 npm dependencies and ~45 PackageReferences), and a queue nobody reads is not a control.
# Minor+patch land as one PR per ecosystem; majors arrive individually so they get real attention.
#
# `cooldown` delays adopting a release by a week. Version automation's own supply-chain risk is
# pulling a freshly published compromised release within hours of it landing; a week is long enough
# for a bad release to be yanked. It can push an update out by up to a further week on top of the
# weekly cadence, which is a trade worth making. It applies to version updates only — security
# updates are deliberately never delayed.
#
# Owning docs: docs/architecture/16-security.md §6 · docs/engineering/frontend-toolchain.md
version: 2

updates:
  # ── Frontend (npm) ────────────────────────────────────────────────────────
  # Dependabot resolves on Linux, which removes the OS-divergence cause of lockfile drift
  # (frontend-toolchain.md cause 2). It does *not* remove cause 1: the npm major version, which
  # Dependabot controls and this repo doesn't. `npm ci` gates that rather than preventing it — if a
  # Dependabot PR fails install, check out its branch, regenerate the lockfile per
  # frontend-toolchain.md, and push. `@dependabot recreate` will not fix it.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch
    # Held-back updates. Recorded in docs/architecture/16-security.md §6 as standing deviations.
    #
    # CAVEAT, because it is easy to assume otherwise: `ignore` is consulted for **security** updates
    # too (unlike `cooldown` above, which really is version-updates-only). An advisory whose only fix
    # ships in a blocked version cannot be raised while the entry exists. In-major security patches
    # still flow, and all three are devDependencies, so the exposure is bounded — but these entries
    # are not free, and each needs a real removal condition or an explicit note that it's permanent.
    ignore:
      # ESLint 10 removed an API that eslint-plugin-react (pulled in by eslint-config-next) still
      # calls: "TypeError: contextOrFilename.getFilename is not a function", which fails `npm run
      # lint` outright. Nothing released supports it — eslint-plugin-react@7.37.5 peers `^9.7`, and
      # even eslint-config-next canary still depends on ^7.37. Remove when that changes.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # TypeScript **7+** only, deliberately not all majors. typescript-eslint hard-refuses TS 7 at
      # load time ("typescript-eslint does not support TS 7.0"); it accepts TS 6.0 (peers
      # `>=4.8.4 <6.1.0` — past 6.0 it warns rather than refusing). Blocking every major would have
      # quietly stranded us on 5 while 6.0.3 shipped. Remove when typescript-eslint supports TS 7 —
      # its own error message points at typescript-eslint#10940, which tracks ">=7.1".
      - dependency-name: typescript
        versions: [">=7"]
      # @types/node tracks the runtime, not the registry: it follows NODE_VERSION in ci.yml, or we
      # typecheck against a stdlib we don't run and accept code that fails at runtime. This one has
      # no removal condition — it is permanent policy. When Node moves, bump this deliberately as
      # part of that change (frontend-toolchain.md rule 2).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # ── Backend (NuGet) ───────────────────────────────────────────────────────
  # Versions are centrally managed in `/Directory.Packages.props`, so Dependabot edits that one file
  # instead of walking 11 .csproj files. That removes the failure this config previously had to warn
  # about: a bump landing in one project and silently leaving the others behind (which is exactly
  # what happened with coverlet.collector in #26, and with EF Core Design vs Npgsql).
  #
  # It also retires the open question about whether discovery through `FieldKit.slnx` — the new XML
  # solution format, which also references `frontend/frontend.esproj` — finds every project. There is
  # now a single manifest at a fixed path, so there is nothing to discover.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      dotnet-minor-patch:
        update-types:
          - minor
          - patch

  # ── CI (GitHub Actions) ───────────────────────────────────────────────────
  # A stale action version is a supply-chain surface as much as a stale package. Action majors are
  # the breaking kind (runner and artifact API changes), so they stay ungrouped like the others.
  # In practice the group is currently inert: the workflow pins actions by major tag (`@v4`), and
  # Dependabot only raises a PR for those when a new *major* appears — so expect individual PRs
  # here, not a grouped one. The group starts mattering if actions are ever pinned by SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
